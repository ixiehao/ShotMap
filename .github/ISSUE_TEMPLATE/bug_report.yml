name: Bug report / 问题报告 / 不具合報告
description: Report a reproducible problem in ShotMap. / 报告可复现问题。 / 再現できる問題を報告します。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not attach private videos or personal data.
        感谢反馈。请勿附上私人视频或个人数据。
        ご報告ありがとうございます。私的な動画や個人情報は添付しないでください。
  - type: input
    id: app-version
    attributes:
      label: App version / 应用版本 / アプリのバージョン
      description: For example, v0.2.13 (18).
      placeholder: v0.2.2 (6)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac type / macOS 版本与 Mac 类型 / macOS バージョンと Mac の種類
      description: Include Apple Silicon or Intel. / 请注明 Apple Silicon 或 Intel。 / Apple Silicon または Intel を含めてください。
      placeholder: macOS 14.0, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤 / 再現手順
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果 / 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果 / 実際の結果
      description: Include an error message or a screenshot with private details removed. / 错误信息或截图请去除私人内容。 / エラーやスクリーンショットから私的な情報を除いてください。
    validations:
      required: true

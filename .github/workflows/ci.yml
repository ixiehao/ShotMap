name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate public project materials
        run: python3 scripts/verify_public_project.py
      - name: Build universal release executable
        run: swift build -c release --arch arm64 --arch x86_64 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test

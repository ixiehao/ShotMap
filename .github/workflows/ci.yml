name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate public project materials
        run: python3 scripts/verify_public_project.py
      - name: Test native packaging safeguards
        run: python3 scripts/test_native_packaging.py
      - name: Run tests
        env:
          SHOTMAP_FRAME_DIAGNOSTICS: '1'
          SHOTMAP_FRAME_PERFORMANCE: '1'
        run: swift test

  native-release:
    name: Release / ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build native release executable
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          swift build -c release --arch "$TARGET_ARCH" --scratch-path ".build/package-$TARGET_ARCH" \
            -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          binary_dir="$(swift build -c release --arch "$TARGET_ARCH" --scratch-path ".build/package-$TARGET_ARCH" --show-bin-path)"
          python3 scripts/verify_native_binary.py --arch "$TARGET_ARCH" "$binary_dir/ShotMap"

name: Deploy official website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-tests/**'
      - 'scripts/search-content.py'
      - 'search-content.config.json'
      - 'scripts/serve-website-tests.mjs'
      - 'scripts/website-test-matrix.mjs'
      - 'website-test.config.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-tests/**'
      - 'scripts/search-content.py'
      - 'search-content.config.json'
      - 'scripts/serve-website-tests.mjs'
      - 'scripts/website-test-matrix.mjs'
      - 'website-test.config.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Discover website languages
    runs-on: ubuntu-24.04
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: languages
        run: node scripts/website-test-matrix.mjs
  validate:
    name: Website (${{ matrix.browser }}, ${{ matrix.language }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    env:
      SITE_TEST_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:website
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:website -- --project=${{ matrix.browser }}
      - name: Save layout reports and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: website-report-${{ matrix.browser }}-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/report.json
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify localized Pages
        run: node website/build-static-pages.mjs --check
      - name: Set up website build runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and check search reading files
        run: |
          npm run build:website
          python3 scripts/search-content.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
  notify-search:
    name: Notify search engines
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Submit published canonical pages
        id: indexnow
        continue-on-error: true
        run: python3 scripts/search-content.py --notify
      - name: Report notification retry instructions
        if: steps.indexnow.outcome == 'failure'
        run: echo '::warning::Pages is published but IndexNow was not confirmed. Retry npm run notify:search after propagation. Indexing is not guaranteed.'
